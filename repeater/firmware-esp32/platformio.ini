; Tackcall repeater — ESP32-firmware
; Valmistusohje: repeater/firmware-esp32 (ESP32-firmware-valmistusohje v1)
;
; Kaksi ymparistoa:
;   [env:esp32]   - varsinainen laite (Arduino-ydin, U8g2, NimBLE)
;   [env:native]  - host-testit RepeaterPacketille (pelkka C++, ei laitetta)
;
; Aja host-testit:   pio test -e native
; Kaanna laitteelle:  pio run -e esp32
; Flashaa:            pio run -e esp32 -t upload

[platformio]
default_envs = esp32

; ---------- Varsinainen laite ----------
[env:esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2 @ ^2.35.30
    h2zero/NimBLE-Arduino @ ^1.4.2
build_flags =
    -D CORE_DEBUG_LEVEL=0

; ---------- Host-testit (natiivi, ei laitetta) ----------
; RepeaterPacket on puhdasta C++:aa ilman Arduino-riippuvuuksia,
; joten se kaantyy ja testataan suoraan kehityskoneella.
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_flags =
    -std=c++11
    -D UNIT_TEST
